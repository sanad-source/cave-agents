[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caveagents"
version = "0.4.0"
description = "Token-pruned multi-agent orchestration framework operating on an inverted cost frontier."
readme = "README.md"
authors = [
  { name = "sanad-source", email = "sanad-source@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "tiktoken>=0.5.0",
  "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pyyaml>=6.0"
]

[project.scripts]
caveagents = "caveagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
